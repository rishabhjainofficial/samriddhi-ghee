<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none" fill="none">
  <defs>
    <linearGradient id="farHills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#260E06" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="midHills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1A0601" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="foreHills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#140400" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- 1. Deepest Connected Aravali Mountain Range (Far Ridge) -->
  <!-- Seamless: Starts at (0, 120), ends at (1440, 120) with matching slope -->
  <path d="M 0 120
           C 60 100, 120 70, 180 85
           C 240 100, 300 135, 360 125
           C 420 115, 480 60, 540 70
           C 600 80, 660 125, 720 115
           C 780 105, 840 50, 900 65
           C 960 80, 1020 130, 1080 120
           C 1140 110, 1200 65, 1260 75
           C 1320 85, 1380 140, 1440 120
           L 1440 320 L 0 320 Z"
        fill="url(#farHills)" />

  <!-- 2. Mid Connected Mountain Ridge (Middle Hills) -->
  <!-- Seamless: Starts at (0, 160), ends at (1440, 160) with matching slope -->
  <path d="M 0 160
           C 80 140, 140 110, 220 125
           C 300 140, 360 180, 440 170
           C 520 160, 580 115, 660 130
           C 740 145, 800 185, 880 175
           C 960 165, 1020 120, 1100 135
           C 1180 150, 1240 190, 1320 180
           C 1370 170, 1410 175, 1440 160
           L 1440 320 L 0 320 Z"
        fill="url(#midHills)" />

  <!-- Gentle Golden Sun behind the middle peaks -->
  <circle cx="720" cy="115" r="50" fill="#F59E0B" fill-opacity="0.16" />
  <circle cx="720" cy="115" r="85" fill="#F59E0B" fill-opacity="0.08" />

  <!-- Rajasthani Heritage Chhatri atop the central ridge -->
  <g transform="translate(702, 88) scale(0.6)" fill="#F59E0B" fill-opacity="0.32">
    <path d="M30 35 Q30 12 50 8 Q70 12 70 35 Z"/>
    <rect x="34" y="35" width="3" height="24"/>
    <rect x="49" y="35" width="3" height="24"/>
    <rect x="63" y="35" width="3" height="24"/>
    <rect x="25" y="59" width="50" height="3"/>
  </g>

  <!-- 3. Foreground Continuous Rolling Pasture & Hills -->
  <!-- Seamless: Starts at (0, 205), ends at (1440, 205) with matching slope -->
  <path d="M 0 205
           C 90 190, 160 170, 250 185
           C 340 200, 410 230, 500 220
           C 590 210, 660 180, 750 190
           C 840 200, 910 235, 1000 225
           C 1090 215, 1160 180, 1250 195
           C 1320 210, 1380 220, 1440 205
           L 1440 320 L 0 320 Z"
        fill="url(#foreHills)" />

  <!-- Connecting Pastoral Features Integrated Onto The Ridge Lines -->

  <!-- Left Gir Cow on Ridge (x: 280) -->
  <g transform="translate(280, 155) scale(0.65)" fill="#F59E0B" fill-opacity="0.35">
    <ellipse cx="60" cy="45" rx="35" ry="22"/>
    <path d="M42 25 Q52 8 64 24 Z"/>
    <path d="M25 45 Q15 40 10 50 Q5 65 18 68 Q25 68 32 55 Z"/>
    <path d="M16 42 Q10 32 18 28 Q24 35 22 42 Z"/>
    <rect x="32" y="60" width="5" height="28"/>
    <rect x="42" y="60" width="5" height="26"/>
    <rect x="75" y="60" width="5" height="28"/>
    <rect x="85" y="60" width="5" height="26"/>
    <path d="M95 42 Q102 55 98 70" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Center-Right Cow with her Calf (x: 880) -->
  <g transform="translate(880, 155) scale(0.68)" fill="#F59E0B" fill-opacity="0.38">
    <ellipse cx="60" cy="45" rx="35" ry="22"/>
    <path d="M42 25 Q52 8 64 24 Z"/>
    <path d="M25 45 Q15 40 10 50 Q5 65 18 68 Q25 68 32 55 Z"/>
    <path d="M16 42 Q10 32 18 28 Q24 35 22 42 Z"/>
    <rect x="32" y="60" width="5" height="28"/>
    <rect x="42" y="60" width="5" height="26"/>
    <rect x="75" y="60" width="5" height="28"/>
    <rect x="85" y="60" width="5" height="26"/>
    <path d="M95 42 Q102 55 98 70" stroke="#F59E0B" stroke-opacity="0.38" stroke-width="2.5" fill="none"/>

    <!-- Small Calf beside mother -->
    <g transform="translate(100, 20) scale(0.55)">
      <ellipse cx="40" cy="35" rx="20" ry="14"/>
      <path d="M30 22 Q36 12 44 22 Z"/>
      <path d="M18 35 Q10 30 8 38 Q5 48 14 50 Q20 50 24 42 Z"/>
      <rect x="22" y="45" width="3.5" height="18"/>
      <rect x="28" y="45" width="3.5" height="16"/>
      <rect x="48" y="45" width="3.5" height="18"/>
      <rect x="54" y="45" width="3.5" height="16"/>
    </g>
  </g>

  <!-- Native Banyan / Kadam Tree silhouettes rooted in hills -->
  <g transform="translate(130, 130) scale(0.65)" fill="#F59E0B" fill-opacity="0.25">
    <path d="M50 140 Q45 85 35 45 Q55 55 70 140 Z"/>
    <circle cx="35" cy="40" r="32"/>
    <circle cx="65" cy="30" r="38"/>
    <circle cx="90" cy="45" r="28"/>
    <circle cx="50" cy="15" r="30"/>
  </g>

  <g transform="translate(1180, 125) scale(0.7)" fill="#F59E0B" fill-opacity="0.28">
    <path d="M50 140 Q45 85 35 45 Q55 55 70 140 Z"/>
    <circle cx="35" cy="40" r="34"/>
    <circle cx="65" cy="30" r="40"/>
    <circle cx="95" cy="48" r="30"/>
    <circle cx="55" cy="15" r="32"/>
  </g>

  <!-- 4. Subtle Base Plain so the bottom edge transitions into deep footer base -->
  <rect x="0" y="270" width="1440" height="50" fill="#140400" fill-opacity="0.9" />
</svg>
